<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img"><title>원래 예약과 연쇄 폭발 시각</title><desc>먼저 터진 폭탄의 신호가 B와 C의 예약 시각을 차례로 앞당긴다.</desc><rect width="600" height="180" rx="12" fill="#f6f8fa"/><g font-family="system-ui, 'Malgun Gothic', sans-serif" font-size="16" font-weight="550"><circle cx="96" cy="67" r="20" stroke="#af481e" stroke-width="2" fill="#af481e" fill-opacity=".1"/><text x="90" y="73" fill="#23354b">A</text><text x="65" y="124" fill="#23354b">0 → 0초</text><circle cx="287" cy="67" r="20" stroke="#af481e" stroke-width="2" fill="#af481e" fill-opacity=".1"/><text x="281" y="73" fill="#23354b">B</text><text x="256" y="124" fill="#23354b">9 → 0.5초</text><circle cx="478" cy="67" r="20" stroke="#af481e" stroke-width="2" fill="#af481e" fill-opacity=".1"/><text x="472" y="73" fill="#23354b">C</text><text x="447" y="124" fill="#23354b">8 → 1초</text><path d="M118 67 L264 67" stroke="#8698aa" stroke-width="3" fill="none"/><path d="M264 67 L254 61" stroke="#8698aa" stroke-width="3" fill="none"/><path d="M309 67 L455 67" stroke="#8698aa" stroke-width="3" fill="none"/><path d="M455 67 L445 61" stroke="#8698aa" stroke-width="3" fill="none"/><text x="148" y="48" fill="#23354b">+0.5초</text><text x="339" y="48" fill="#23354b">+0.5초</text></g></svg>
