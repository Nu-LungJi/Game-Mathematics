<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img"><title>맵 안의 두 플레이어와 화면</title><desc>예시 카메라 중심 (6,3)에서 가로 10 세로 5 화면에 두 플레이어와 여백이 들어간다.</desc><rect width="600" height="180" rx="12" fill="#f6f8fa"/><g font-family="system-ui, 'Malgun Gothic', sans-serif" font-size="16" font-weight="550"><rect x="75" y="15" width="300" height="150" fill="#dee5eb"/><rect x="90" y="82.5" width="150" height="75" fill="#acd8c6"/><circle cx="105" cy="135" r="5" fill="#17669b"/><circle cx="225" cy="105" r="5" fill="#17669b"/><text x="397" y="67" fill="#23354b">회색 · 전체 맵</text><text x="397" y="98" fill="#09735b">초록 · 10 × 5 화면</text><text x="397" y="129" fill="#17669b">점 · 플레이어</text></g></svg>
