<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img"><title>프레임 안의 피해 시각</title><desc>0.4초와 1.6초 사이에는 0.5초, 1초, 1.5초의 세 피해 시각이 있다.</desc><rect width="600" height="180" rx="12" fill="#f6f8fa"/><g font-family="system-ui, 'Malgun Gothic', sans-serif" font-size="16" font-weight="550"><path d="M58 88 L550 88" stroke="#8698aa" stroke-width="3" fill="none"/><rect x="135" y="52" width="224" height="11" fill="#8cccb4"/><text x="151" y="41" fill="#09735b">이번 갱신 0.4 → 1.6초</text><circle cx="60" cy="88" r="5" fill="#8698aa"/><text x="48" y="122" fill="#23354b">0s</text><circle cx="155" cy="88" r="5" fill="#09735b"/><text x="143" y="122" fill="#23354b">0.5s</text><circle cx="250" cy="88" r="5" fill="#09735b"/><text x="238" y="122" fill="#23354b">1s</text><circle cx="345" cy="88" r="5" fill="#09735b"/><text x="333" y="122" fill="#23354b">1.5s</text><circle cx="440" cy="88" r="5" fill="#8698aa"/><text x="428" y="122" fill="#23354b">2s</text><text x="400" y="153" fill="#23354b">2초 피해 후 만료</text></g></svg>
