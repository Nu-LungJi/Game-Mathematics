<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img"><title>두 출발점에서의 경로 비용</title><desc>E1에서 B로 직행하면 7초지만 E2에서 C를 거치면 5초다.</desc><rect width="600" height="180" rx="12" fill="#f6f8fa"/><g font-family="system-ui, 'Malgun Gothic', sans-serif" font-size="16" font-weight="550"><path d="M50 90 L190 40" stroke="#8698aa" stroke-width="3" fill="none"/><text x="110" y="54" fill="#23354b">2초</text><path d="M50 90 L240 126" stroke="#8698aa" stroke-width="3" fill="none"/><text x="131" y="130" fill="#23354b">7초</text><path d="M385 126 L240 126" stroke="#8698aa" stroke-width="3" fill="none"/><text x="304" y="112" fill="#23354b">4초</text><path d="M500 50 L385 126" stroke="#8698aa" stroke-width="3" fill="none"/><text x="447" y="100" fill="#23354b">1초</text><circle cx="50" cy="90" r="8" fill="#17669b"/><text x="40" y="118" fill="#23354b">E1</text><circle cx="190" cy="40" r="8" fill="#17669b"/><text x="180" y="68" fill="#23354b">A</text><circle cx="240" cy="126" r="8" fill="#09735b"/><text x="230" y="154" fill="#23354b">B</text><circle cx="385" cy="126" r="8" fill="#17669b"/><text x="375" y="154" fill="#23354b">C</text><circle cx="500" cy="50" r="8" fill="#17669b"/><text x="490" y="78" fill="#23354b">E2</text></g></svg>
