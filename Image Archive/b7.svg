<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" role="img"><title>재장전과 측정 종료 시각</title><desc>마지막 탄 직후 2초 동안 재장전한다. 4초의 발사는 측정 밖이다.</desc><rect width="600" height="180" rx="12" fill="#f6f8fa"/><g font-family="system-ui, 'Malgun Gothic', sans-serif" font-size="16" font-weight="550"><path d="M75 97 L526 97" stroke="#8698aa" stroke-width="3" fill="none"/><path d="M175 60 L375 60" stroke="#09735b" stroke-width="3" fill="none" stroke-dasharray="6 5"/><text x="235" y="50" fill="#09735b">재장전</text><circle cx="75" cy="97" r="6" fill="#17669b"/><text x="65" y="129" fill="#23354b">0s</text><circle cx="125" cy="97" r="6" fill="#17669b"/><text x="115" y="129" fill="#23354b">0.5s</text><circle cx="175" cy="97" r="6" fill="#17669b"/><text x="165" y="129" fill="#23354b">1s</text><circle cx="375" cy="97" r="6" fill="#17669b"/><text x="365" y="129" fill="#23354b">3s</text><circle cx="425" cy="97" r="6" fill="#17669b"/><text x="415" y="129" fill="#23354b">3.5s</text><circle cx="475" cy="97" r="6" stroke="#af481e" stroke-width="2" fill="#af481e" fill-opacity=".1"/><text x="465" y="129" fill="#23354b">4s</text><text x="434" y="157" fill="#af481e">구간 끝 제외</text></g></svg>
